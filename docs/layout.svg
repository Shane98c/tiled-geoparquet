<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 588" width="800" height="588" role="img" aria-labelledby="t d">
<title id="t">Layout of a Tiled GeoParquet file</title>
<desc id="d">The file drawn as a table and as bytes. In the table, rows follow a Hilbert curve and the source columns hold every row. Each overview column serves one or more zooms. It holds packed geometry for the rows shown at those zooms. This example shows fewer rows at coarse zooms, and the finest overview shows every feature. The rows centred in one tile are one run at every zoom. To draw an overview tile, a map reads the first 16 KB of the file once, then a leaf of the spatial directory, then the pages that leaf lists.</desc>
<style>
