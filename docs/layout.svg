<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 612" width="800" height="612" role="img" aria-labelledby="t d">
<title id="t">Layout of a Tiled GeoParquet file</title>
<desc id="d">The file drawn as a table and as bytes. In the table, rows follow a Hilbert curve and the source columns hold every row. Each overview column serves one or more zooms. It holds packed geometry for the rows shown at those zooms. This example shows fewer rows at coarse zooms, and the finest overview shows every feature. The rows centred in one tile are one run at every zoom. To draw an overview tile, a map reads the first 16 KB of the file once, then a leaf of the spatial directory, then the pages that leaf lists.</desc>
<style>
  .bg { fill: #ffffff }
  .ink { fill: #1b1e23 }
  .dim { fill: #666b73 }
  .on { fill: #1b1e23 }
  .inv { fill: #ffffff }
  .stroke { stroke: #1b1e23; fill: none }
  .src { fill: #c7ccd4 }
  .ovr { fill: #64b9c4 }
  .att { fill: #64b9c4; fill-opacity: .42 }
  .idx { fill: #bc85d9 }
  .tile { fill: #ea9755 }
  .tilebox { stroke: #ea9755; fill: none }
  .null { stroke: #d5d8dd; fill: none }
  .gap { stroke: #ffffff }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px }
  .h { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: .09em }
  .s { font-size: 11px }
  .n { font-size: 11px; font-weight: 700 }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1b1e23 }
    .ink { fill: #ebebec }
    .dim { fill: #9ba1aa }
    .inv { fill: #1b1e23 }
    .stroke { stroke: #ebebec }
    .src { fill: #50555e }
    .null { stroke: #3a3d43 }
    .gap { stroke: #1b1e23 }
  }
</style>
